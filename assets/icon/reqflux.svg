  <rect width="512" height="512" rx="112" fill="#2B45B8"/>
  <g transform="translate(56 56) scale(16.6667)" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round">
    <path d="m22 2-7 20-4-9-9-4Z"/>
