[workspace]
members = [
    "crates/relay",
    "crates/relay_core",
    "crates/relay_engine",
    "crates/relay_http",
    "crates/relay_mcp",
    "crates/relay_postman",
    "crates/relay_script",
    "crates/relay_store",
    "crates/relay_ui",
]
default-members = ["crates/relay"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.1.0-dev.0"
authors = ["Ignacio Perez <ignacio@feuer.me>"]
description = "A keyboard-first, local-first HTTP client"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
relay_core = { path = "crates/relay_core" }
relay_engine = { path = "crates/relay_engine" }
relay_http = { path = "crates/relay_http" }
relay_mcp = { path = "crates/relay_mcp" }
relay_postman = { path = "crates/relay_postman" }
relay_script = { path = "crates/relay_script" }
relay_store = { path = "crates/relay_store" }
relay_ui = { path = "crates/relay_ui" }

anyhow = "1"
env_logger = "0.11"
log = "0.4"

# GPUI comes from the published crates. The versions follow the newest
# gpui-pre release the UI automation bridge (gpui-mcp) supports: gpui-pre 0.3.7,
# which is what gpui-component 0.7.0 and gpui-pre-platform 0.3.7 pin.
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui-component = { version = "=0.7.0" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.7", default-features = false, features = ["font-kit", "wayland", "x11"] }

# UI automation bridge, installed in every window so agents can drive the app
# through `relay mcp`. The protocol crate is what `relay_mcp` will speak to it.
gpui-mcp = { git = "https://github.com/themixednuts/gpui-mcp", rev = "eb248ccf43847797b9067c47eeef1dd188dc03a6", default-features = false, features = ["gpui-pre"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unwrap_in_result = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
let_underscore_must_use = "warn"

# The bridge needs observation and input hooks that upstream GPUI does not
# have yet. gpui-mcp publishes gpui-pre 0.3.7 with them applied; this keeps
# the app, gpui-component and the bridge on that one GPUI build. Drop it when
# gpui-pre ships the hooks.
[patch.crates-io]
gpui-pre = { git = "https://github.com/themixednuts/gpui-mcp", rev = "eb248ccf43847797b9067c47eeef1dd188dc03a6" }

# Line tables keep backtraces usable at a fraction of the link time and
# memory that full debug info costs with GPUI in the graph.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = "symbols"
